<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Lock icon with gradient -->
  <defs>
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#863bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e14ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lock body (rectangle) -->
  <rect x="12" y="20" width="24" height="18" rx="2" fill="url(#lockGradient)" stroke="#863bff" stroke-width="1.5"/>
  
  <!-- Lock shackle (arc/semicircle) -->
  <path d="M 16 20 Q 16 8 24 8 Q 32 8 32 20" fill="none" stroke="url(#lockGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Lock keyhole -->
  <circle cx="24" cy="28" r="2.5" fill="#863bff"/>
</svg>